<svg width="544" height="357" viewBox="0 0 544 357" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dynamic scaling queue with expanding capacity fields">
<style>
  .field { transform-box: fill-box; transform-origin: center; animation: scale-field 6s cubic-bezier(.2,.8,.25,1) infinite; }
  .field-1 { animation-delay: 0s; }
  .field-2 { animation-delay: 1.2s; }
  .field-3 { animation-delay: 2.4s; }
  .field-4 { animation-delay: 3.6s; }
  .field-5 { animation-delay: 4.8s; }
  @keyframes scale-field {
    0% { opacity: 0; transform: scale(.12); }
    14% { opacity: .28; }
    70% { opacity: .06; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .field { animation: none !important; opacity: .2; } }
</style>
